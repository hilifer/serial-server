<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>耀嵘 — 光储充管理系统</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <img src="/images/logo2.png" class="logo-img" alt="logo">
      <span class="system-name">耀嵘—光储充管理系统</span>
    </div>
    <div class="header-right">
      <span class="clock" id="clock"></span>
      <a href="/detail.html" class="nav-btn" title="能源看板">&#9881;</a>
    </div>
  </header>

  <!-- Parking map -->
  <div class="map-container" id="mapContainer">
    <img src="/images/base.jpg" class="base-map" alt="停车场">

    <!-- Cars (dynamically inserted) -->
    <div id="carsLayer"></div>

    <!-- Charging piles (dynamically inserted) -->
    <div id="pilesLayer"></div>
  </div>

  <!-- Footer stats -->
  <div class="footer" id="footer">
    <div class="footer-section">
      <span class="label-yellow">充电桩</span>
      <span class="val-green">空闲 <b id="pilesFree">-</b> 个</span>
      <span class="label-yellow">状 态:</span>
      <span class="val-red">占用 <b id="pilesBusy">-</b> 个</span>
    </div>
    <div class="footer-section">
      <span class="label-yellow">车 位</span>
      <span class="val-green">空闲 <b id="parkFree">-</b> 个</span>
      <span class="label-yellow">状 态:</span>
      <span class="val-red">占用 <b id="parkOccupied">-</b> 个</span>
    </div>
  </div>

  <!-- Car detail popup -->
  <div class="popup" id="popup" style="display:none">
    <div class="popup-content" id="popupContent"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/parking.js"></script>
</body>
</html>
