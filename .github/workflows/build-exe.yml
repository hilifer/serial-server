name: Build Windows EXE

on:
  push:
    branches: [claude/understand-project-TBDmP]
    paths:
      - '**.py'
      - 'web/**'
      - 'installer/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm `
            --onefile `
            --name "yriot" `
            --console `
            --strip `
            --optimize 2 `
            --add-data "config.yaml;." `
            --add-data "web;web" `
            --hidden-import serial_manager `
            --hidden-import meter `
            --hidden-import meter_api `
            --hidden-import parking `
            --hidden-import state `
            --hidden-import deps `
            --hidden-import colors `
            --hidden-import flask `
            --hidden-import yaml `
            --hidden-import paho.mqtt.client `
            --hidden-import serial `
            --hidden-import requests `
            --hidden-import jinja2 `
            --hidden-import markupsafe `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module numpy `
            --exclude-module scipy `
            --exclude-module PIL `
            server.py

      - name: Prepare release files
        run: |
          mkdir release
          copy dist\yriot.exe release\
          copy config.yaml release\
          echo @echo off > release\启动.bat
          echo chcp 65001 ^>nul >> release\启动.bat
          echo title 耀嵘光储充管理系统 >> release\启动.bat
          echo start "" cmd /c "timeout /t 3 /nobreak ^>nul ^&^& start http://localhost:8000/" >> release\启动.bat
          echo "%%~dp0yriot.exe" >> release\启动.bat
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yriot-windows-exe
          path: release/

      - name: Commit EXE to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p installer/output
          copy dist\yriot.exe installer\output\yriot.exe
          git add installer/output/yriot.exe
          git commit -m "build: yriot.exe Windows executable (auto-built)" || echo "No changes"
          git push
        shell: cmd
