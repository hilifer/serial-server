# MQTT WebSocket Serial Server Configuration

mqtt:
  broker: "localhost"
  port: 1883
  ws_port: 9001
  username: ""
  password: ""
  client_id_prefix: "serial-server"
  keepalive: 60

serial_ports:
  - name: "COM31"
    port: "COM31"           # Windows: COM31, Linux: /dev/ttyUSB0
    baudrate: 9600
    bytesize: 8
    parity: "N"             # N=None, E=Even, O=Odd
    stopbits: 1
    timeout: 0.1
    mqtt_topic_prefix: "serial/com31"

  - name: "COM32"
    port: "COM32"
    baudrate: 9600
    bytesize: 8
    parity: "N"
    stopbits: 1
    timeout: 0.1
    mqtt_topic_prefix: "serial/com32"

  - name: "COM33"
    port: "COM33"
    baudrate: 9600
    bytesize: 8
    parity: "N"
    stopbits: 1
    timeout: 0.1
    mqtt_topic_prefix: "serial/com33"

logging:
  level: "INFO"             # DEBUG, INFO, WARNING, ERROR
  file: "serial_server.log"
